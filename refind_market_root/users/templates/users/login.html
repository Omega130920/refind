{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Refind Market</title>
    
    <style>
        :root {
            --bg-main: #e2edf5ff; 
            --nav-glass: rgba(255, 255, 255, 0.7);
            --text-dark: #1a1a1b;
            --text-muted: #6e6d7a;
            --accent-blue: #007bff;
            --accent-orange: #f39c12; /* Added for Omega Branding */
            --navy-blue: #1c2e4a;     
            --card-shadow: 0 20px 40px -10px rgba(0,0,0,0.05);
            --radius-lg: 28px;
        }

        body {
            background-color: var(--bg-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* NAVIGATION: Consistent Floating Style */
        nav {
            background: var(--nav-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: sticky;
            top: 20px; 
            z-index: 1000;
            margin: 0 24px;
            padding: 10px 0;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
        }

        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .rf-icon {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white; font-weight: 900; font-size: 1.5rem;
            width: 52px; height: 52px; display: flex;
            align-items: center; justify-content: center;
            border-radius: 14px; box-shadow: 0 6px 15px rgba(243, 156, 18, 0.35);
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-text .brand { font-size: 1.6rem; font-weight: 900; color: var(--navy-blue); letter-spacing: -1px; text-transform: uppercase; }
        .logo-text .subtext { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; margin-top: 4px; }

        .nav-actions { display: flex; align-items: center; gap: 15px; }

        .btn-register-nav {
            text-decoration: none;
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px 20px;
            border: 2px solid var(--accent-blue);
            border-radius: 14px;
            transition: 0.3s;
        }
        .btn-register-nav:hover { background: var(--accent-blue); color: white; }

        /* AUTH CONTAINER */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .auth-card h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--navy-blue);
            margin: 0 0 10px 0;
            letter-spacing: -1.5px;
            text-align: center;
        }

        .auth-card p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* FORM STYLING */
        .auth-card form p { margin-bottom: 20px; }
        .auth-card form label {
            display: block;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--navy-blue);
            margin-bottom: 8px;
        }

        .auth-card input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid #f1f1f1;
            font-size: 1rem;
            background: #fafafa;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .auth-card input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.05);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--navy-blue);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(28, 46, 74, 0.15);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(28, 46, 74, 0.25);
            background: #253a5c;
        }

        .auth-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #f1f1f1;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <a href="{% url 'item_list' %}" class="logo-box">
                <img src="{% static 'images/Re-Find_logo.jpg' %}" alt="" 
                     style="height: 52px; width: auto; display: block;"
                     onerror="this.style.display='none'; document.getElementById('css-logo').style.display='flex';">
                
                <div id="css-logo" style="display:none; align-items:center; gap:14px;">
                    <div class="rf-icon">RF</div>
                    <div class="logo-text">
                        <span class="brand">RE-FIND</span>
                        <span class="subtext">MARKET</span>
                    </div>
                </div>
            </a>

            <div class="nav-actions">
                {% if user.is_authenticated and user.username|lower == 'omega' %}
                    <a href="{% url 'admin_dashboard' %}" style="color: var(--accent-orange); font-weight: 900; text-decoration: none; font-size: 0.8rem;">🛡️ COMMAND CENTER</a>
                {% endif %}
                <a href="{% url 'register' %}" class="btn-register-nav">Create Account</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Secure login for Refind Market members.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="login-btn" type="submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Need an account? <a href="{% url 'register' %}">Join the community</a>
            </div>
        </div>
    </div>

</body>
</html>
