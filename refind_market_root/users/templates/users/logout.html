{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Refind Market</title>
    
    <style>
        :root {
            --bg-main: #e2edf5ff; 
            --nav-glass: rgba(255, 255, 255, 0.7);
            --text-dark: #1a1a1b;
            --text-muted: #6e6d7a;
            --accent-blue: #007bff;
            --navy-blue: #1c2e4a;     
            --card-shadow: 0 20px 40px -10px rgba(0,0,0,0.05);
            --radius-lg: 28px;
        }

        body {
            background-color: var(--bg-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* NAVIGATION: Consistent Floating Style */
        nav {
            background: var(--nav-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: sticky;
            top: 20px; 
            z-index: 1000;
            margin: 0 24px;
            padding: 10px 0;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
        }

        .logo-box { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .rf-icon {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white; font-weight: 900; font-size: 1.5rem;
            width: 52px; height: 52px; display: flex;
            align-items: center; justify-content: center;
            border-radius: 14px; box-shadow: 0 6px 15px rgba(243, 156, 18, 0.35);
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-text .brand { font-size: 1.6rem; font-weight: 900; color: var(--navy-blue); letter-spacing: -1px; text-transform: uppercase; }
        .logo-text .subtext { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; margin-top: 4px; }

        /* LOGOUT CARD */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 60px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .goodbye-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .auth-card h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--navy-blue);
            margin: 0 0 15px 0;
            letter-spacing: -1.5px;
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-weight: 500;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.15);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 123, 255, 0.25);
        }

        .market-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .market-link:hover {
            color: var(--navy-blue);
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <a href="{% url 'item_list' %}" class="logo-box">
                <img src="{% static 'images/Re-Find_logo.jpg' %}" alt="" 
                     style="height: 52px; width: auto; display: block;"
                     onerror="this.style.display='none'; document.getElementById('css-logo').style.display='flex';">
                
                <div id="css-logo" style="display:none; align-items:center; gap:14px;">
                    <div class="rf-icon">RF</div>
                    <div class="logo-text">
                        <span class="brand">RE-FIND</span>
                        <span class="subtext">MARKET</span>
                    </div>
                </div>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <span class="goodbye-icon">👋</span>
            <h2>Logged Out</h2>
            <p>You have been successfully signed out of your account. We hope to see you back soon!</p>

            <div class="btn-group">
                <a href="{% url 'login' %}" class="login-btn">Sign Back In</a>
                <a href="{% url 'item_list' %}" class="market-link">Return to Marketplace</a>
            </div>
        </div>
    </div>

</body>
</html>
